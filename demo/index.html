<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>High Card Online</title>
<link rel="icon" href="../icon.svg">
<style>
  :root { --bg:#0f1117; --card:#1a1e2b; --line:#2a3042; --text:#e8eaf0; --muted:#969db4; --blue:#6ea8fe; --gold:#f0b354; --red:#ff6b6b; --green:#5fd38d; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:16px; min-height:100dvh; display:flex; flex-direction:column; gap:12px; }
  h1 { font-size:20px; margin:4px 0; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:16px; min-width:0; flex:1; }
  button { background:var(--blue); color:#0f1117; border:0; border-radius:10px; padding:10px 14px; font-size:15px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.4; cursor:default; }
  .muted { color:var(--muted); font-size:14px; }
  .code { font-size:34px; letter-spacing:6px; font-weight:800; color:var(--gold); }
  .seat { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
  .seat:last-child { border-bottom:0; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:var(--muted); }
  .dot.on { background:var(--green); }
  .hand { display:flex; gap:8px; flex-wrap:wrap; }
  .card { width:62px; height:88px; border-radius:10px; background:#f4f1e8; color:#111; font-size:22px; font-weight:800; display:flex; align-items:center; justify-content:center; border:2px solid transparent; transition:transform .15s; }
  .card.red { color:#c62828; }
  .card.pick { border-color:var(--gold); transform:translateY(-6px); }
  button.card { padding:0; }
  .err { color:var(--red); min-height:1.2em; font-size:14px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>High Card <span class="muted">— online demo</span></h1>

  <section id="home" class="panel">
    <div class="row"><input id="name" maxlength="20" placeholder="Your name" autocomplete="nickname"></div>
    <div class="row" style="margin-top:10px">
      <button id="create">Create room</button>
      <button id="local" class="ghost">Play computers</button>
    </div>
    <div class="row" style="margin-top:10px">
      <input id="codeIn" maxlength="8" placeholder="Room code" autocapitalize="characters">
      <button id="join" class="ghost">Join</button>
    </div>
  </section>

  <section id="lobby" class="panel hidden">
    <div class="muted">Room code</div>
    <div class="code" id="code"></div>
    <div id="seats" style="margin-top:8px"></div>
    <div class="row" style="margin-top:10px">
      <button id="start">Start</button>
      <button id="leave1" class="ghost">Leave</button>
    </div>
  </section>

  <section id="game" class="hidden" style="display:flex;flex-direction:column;gap:12px">
    <div class="panel"><div id="status"></div><div id="table" style="margin-top:8px"></div></div>
    <div class="panel"><div class="muted">Your cards</div><div class="hand" id="hand" style="margin-top:8px"></div></div>
    <div class="row"><button id="leave2" class="ghost">Leave</button></div>
  </section>

  <div class="err" id="err"></div>
</main>
<script type="module">
import { createLocal, createOnline } from "../online.js";
import { highCard, cardName } from "./high-card.js";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const show = (id) => { for (const s of ["home", "lobby", "game"]) $(s).classList.toggle("hidden", s !== id); };
const online = createOnline({ game: highCard });
let room = null; // current room object (local or online)
let snap = null;

try { $("name").value = localStorage.getItem("hc.name") || ""; } catch (e) {}
const name = () => { const n = $("name").value.trim() || "Player"; try { localStorage.setItem("hc.name", n); } catch (e) {} return n; };
const err = (m) => { $("err").textContent = m || ""; };

online.on("change", (s) => { if (room === online) render(s); });
online.on("error", (m) => err(m));

$("create").onclick = async () => {
  err(""); room = online;
  const r = await online.createRoom({ name: name(), seats: ["human", "empty", "computer"] });
  if (!r.ok) err(r.message);
};
$("join").onclick = async () => {
  err(""); room = online;
  const r = await online.joinRoom($("codeIn").value, name());
  if (!r.ok) { err(r.message); show("home"); }
};
$("local").onclick = () => {
  err("");
  room = createLocal({ game: highCard, seats: ["human", "computer", "computer"], names: [name()] });
  room.on("change", render);
  room.start();
};
$("start").onclick = async () => { const r = await online.start(); if (!r.ok) err(r.message); };
const leave = async () => { if (room === online) await online.leave(); else if (room) room.close(); room = null; snap = null; show("home"); };
$("leave1").onclick = leave; $("leave2").onclick = leave;

function render(s) {
  snap = s;
  if (["closed", "left", "none"].includes(s.status)) { if (s.status !== "none") err(s.status === "closed" ? "The room was closed." : ""); show("home"); return; }
  if (s.status === "joining") { show("home"); err("Waiting for the host to let you in…"); return; }
  if (s.status === "lobby") {
    show("lobby");
    $("code").textContent = s.code;
    $("start").classList.toggle("hidden", !s.isHost);
    $("seats").innerHTML = s.seats.map((x, i) => `<div class="seat"><span><span class="dot ${x.online ? "on" : ""}"></span>${esc(x.kind === "empty" ? "Open seat" : x.name)}${i === s.mySeat ? " (you)" : ""}${x.isHost ? " · host" : ""}</span>
      ${s.isHost && i !== s.mySeat ? `<button class="ghost" data-seat="${i}" data-kind="${x.kind === "computer" ? "empty" : "computer"}">${x.kind === "computer" ? "Open" : "Computer"}</button>` : `<span class="muted">${x.kind}</span>`}</div>`).join("");
    for (const b of $("seats").querySelectorAll("button")) b.onclick = () => online.setSeat(+b.dataset.seat, b.dataset.kind);
    return;
  }
  show("game");
  const p = s.pub;
  const over = s.status === "finished";
  const best = Math.max(...p.scores);
  $("status").innerHTML = over
    ? `<b>Game over.</b> ${p.scores.map((x, i) => (x === best ? esc(s.seats[i].name) : null)).filter(Boolean).join(" & ")} won.`
    : `Round <b>${p.round + 1}</b> of ${p.rounds} · ${s.myTurn ? "<b style='color:var(--gold)'>Pick a card</b>" : "Waiting for others…"}${s.hostAway ? " · <span style='color:var(--red)'>host offline — taking over soon</span>" : ""}`;
  $("table").innerHTML = s.seats.map((x, i) => {
    const last = p.last ? p.last.cards[i] : null;
    return `<div class="seat"><span><span class="dot ${x.online ? "on" : ""}"></span>${esc(x.name)}${i === s.mySeat ? " (you)" : ""}</span>
      <span>${last != null ? `<span class="muted">last</span> ${cardName(last)}${p.last.winner === i ? " ★" : ""} · ` : ""}${p.chosen[i] ? "✓ picked · " : ""}<b>${p.scores[i]}</b></span></div>`;
  }).join("");
  const mine = s.mine || { hand: [], picked: null };
  const cardHtml = (c, btn) => `<${btn ? "button" : "div"} class="card ${(c & 3) === 1 || (c & 3) === 2 ? "red" : ""} ${mine.picked === c ? "pick" : ""}" ${btn ? `data-c="${c}"` : ""}>${cardName(c)}</${btn ? "button" : "div"}>`;
  $("hand").innerHTML = (mine.picked != null ? cardHtml(mine.picked, false) : "") + mine.hand.map((c) => cardHtml(c, s.myTurn)).join("") || `<span class="muted">No cards left.</span>`;
  for (const b of $("hand").querySelectorAll("button")) b.onclick = async () => { const r = await room.act({ card: +b.dataset.c }); if (r && !r.ok) err(r.message); };
}

// Back in your room after a reload.
online.resume().then((back) => { if (back) room = online; });
</script>
</body>
</html>
